name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: patchriot-relay

jobs:
  rust:
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: patchriot-relay
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: adaki2004/patchriot-core
          ref: 87713db87fae3bf85ea5380b44c5a7f9ecee545a
          path: patchriot-core
          token: ${{ secrets.PATCHRIOT_READ_TOKEN || secrets.READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: rustfmt --edition 2024 --check sandbox/probe.rs
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python3 -m unittest discover -s agent -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
        if: runner.os == 'Linux'
      - run: cargo run --locked -- demo
      - name: Build the owned sandbox probe
        if: runner.os == 'Linux'
        run: docker build --network=none -t patchriot-sandbox-probe:ci sandbox
      - name: Test actual sandbox limits and cleanup
        if: runner.os == 'Linux'
        env:
          PATCHRIOT_DOCKER_SOCKET: /var/run/docker.sock
        run: |
          export PATCHRIOT_SANDBOX_IMAGE="$(docker image inspect --format '{{.Id}}' patchriot-sandbox-probe:ci)"
          cargo test --locked --test sandbox_cli -- --ignored --test-threads=1
  dependencies:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: patchriot-relay
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: adaki2004/patchriot-core
          ref: 87713db87fae3bf85ea5380b44c5a7f9ecee545a
          path: patchriot-core
          token: ${{ secrets.PATCHRIOT_READ_TOKEN || secrets.READ_TOKEN || github.token }}
          persist-credentials: false
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: python3 scripts/check-audit-scope.py
      - run: cargo audit
