name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: patchriot-relay

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: patchriot-relay
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: adaki2004/patchriot-core
          ref: bc19377241594ab0a13a27b9993b14d89c0538f2
          path: patchriot-core
          token: ${{ secrets.PATCHRIOT_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo run --locked -- demo
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: patchriot-relay
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: adaki2004/patchriot-core
          ref: bc19377241594ab0a13a27b9993b14d89c0538f2
          path: patchriot-core
          token: ${{ secrets.PATCHRIOT_READ_TOKEN || github.token }}
          persist-credentials: false
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
