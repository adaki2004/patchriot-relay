id: patchriot-git-config-observation
info:
  name: Git configuration exposed over HTTP
  author: patchriot
  severity: medium
  description: Configuration markers are visible without authentication. Review the control response and actual contents before treating this as a finding.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/04-Review_Old_Backup_and_Unreferenced_Files_for_Sensitive_Information
http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/config"
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ["[core]", "repositoryformatversion"]
        condition: and
